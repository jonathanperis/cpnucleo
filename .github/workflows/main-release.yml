name: Main Release

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_hostinger:
        description: Deploy published images to Hostinger Docker Manager
        type: boolean
        default: true

concurrency:
  group: cpnucleo-release-${{ github.ref }}
  cancel-in-progress: false

env:
  AOT: false
  TRIM: true
  EXTRA_OPTIMIZE: true
  BUILD_CONFIGURATION: Release

# Image flow: every image is pushed only under immutable sha-<full sha>-<arch>
# tags and signed keylessly with cosign, tested on a native runner of that
# architecture (and scanned for amd64). Production deploys the signature-verified
# amd64 images; only after a successful deploy on main are the sha-<full sha> and
# latest manifests merged and signed. Trivy scans amd64 only: both architectures
# are built from the same sources and base image tags.

jobs:
  setup-build-test:
    name: Setup, Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - service: WebApi
          - service: GrpcServer
          - service: IdentityApi
          - service: WebClient

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        if: matrix.service != 'WebClient'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Bun
        if: matrix.service == 'WebClient'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        if: matrix.service == 'WebClient'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'

      - name: Restore Dependencies
        if: matrix.service != 'WebClient'
        working-directory: "./src/${{ matrix.service }}"
        run: dotnet restore "${{ matrix.service }}.csproj" -p:Configuration=${{ env.BUILD_CONFIGURATION }} -p:AOT=${{ env.AOT }} -p:Trim=${{ env.TRIM }}

      - name: Install WebClient Dependencies
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun install --frozen-lockfile

      - name: Build Application
        if: matrix.service != 'WebClient'
        working-directory: "./src/${{ matrix.service }}"
        run: dotnet build "${{ matrix.service }}.csproj" -c ${{ env.BUILD_CONFIGURATION }} -p:AOT=${{ env.AOT }} -p:Trim=${{ env.TRIM }} -p:ExtraOptimize=${{ env.EXTRA_OPTIMIZE }}

      - name: Typecheck WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run typecheck

      - name: Test WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run test

      - name: Build WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run build

      # Runs all five suites (Architecture included) exactly once.
      - name: Backend behavioral and database tests
        if: matrix.service == 'WebApi'
        run: dotnet test cpnucleo.slnx -c Release -p:AOT=false -p:Trim=false -p:ExtraOptimize=false -p:SelfContained=false --nologo

  build-push-amd64:
    name: Build & Push amd64 (${{ matrix.service }})
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing of the per-architecture image that is tested and deployed.
      id-token: write
    needs: setup-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASPNETCORE_ENVIRONMENT: Production
    strategy:
      matrix:
        include:
          - service: WebApi
            dockerfile: ./src/WebApi/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-web-api
            cache: web-api
          - service: GrpcServer
            dockerfile: ./src/GrpcServer/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-grpc-server
            cache: grpc-server
          - service: IdentityApi
            dockerfile: ./src/IdentityApi/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-identity-api
            cache: identity-api
          - service: WebClient
            dockerfile: ./src/WebClient/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-web-client
            cache: web-client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push amd64 Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src/
          file: ${{ matrix.dockerfile }}
          push: true
          # Immutable tag only; mutable tags are published after testing.
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}-amd64
          platforms: linux/amd64
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.cache }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}-amd64
          build-args: |
            AOT=${{ env.AOT }}
            TRIM=${{ env.TRIM }}
            EXTRA_OPTIMIZE=${{ env.EXTRA_OPTIMIZE }}
            BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }}
            ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }}
            PUBLIC_WEBAPI_BASE_URL=https://api-cpnucleo.jonathanperis.tech/api
            PUBLIC_IDENTITY_API_BASE_URL=https://identity-cpnucleo.jonathanperis.tech/api
            PUBLIC_IDENTITY_API_ISSUER=https://identity-cpnucleo.jonathanperis.tech

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign amd64 image (keyless)
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The build did not report an image digest." >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST} (sha-${GITHUB_SHA}-amd64)" >> "${GITHUB_STEP_SUMMARY}"

  build-push-arm64:
    name: Build & Push arm64 (${{ matrix.service }})
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing of the per-architecture image that is tested and deployed.
      id-token: write
    needs: setup-build-test
    # Native arm64 runner: no QEMU emulation for ReadyToRun or npm builds.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      ASPNETCORE_ENVIRONMENT: Production
    strategy:
      matrix:
        include:
          - service: WebApi
            dockerfile: ./src/WebApi/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-web-api
            cache: web-api
          - service: GrpcServer
            dockerfile: ./src/GrpcServer/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-grpc-server
            cache: grpc-server
          - service: IdentityApi
            dockerfile: ./src/IdentityApi/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-identity-api
            cache: identity-api
          - service: WebClient
            dockerfile: ./src/WebClient/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-web-client
            cache: web-client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push arm64 Image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src/
          file: ${{ matrix.dockerfile }}
          push: true
          # Immutable tag only; mutable tags come from merge-manifest after arm64 checks.
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}-arm64
          platforms: linux/arm64
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.cache }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}-arm64
          build-args: |
            AOT=${{ env.AOT }}
            TRIM=${{ env.TRIM }}
            EXTRA_OPTIMIZE=${{ env.EXTRA_OPTIMIZE }}
            BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }}
            ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }}
            PUBLIC_WEBAPI_BASE_URL=https://api-cpnucleo.jonathanperis.tech/api
            PUBLIC_IDENTITY_API_BASE_URL=https://identity-cpnucleo.jonathanperis.tech/api
            PUBLIC_IDENTITY_API_ISSUER=https://identity-cpnucleo.jonathanperis.tech

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign arm64 image (keyless)
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The build did not report an image digest." >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST} (sha-${GITHUB_SHA}-arm64)" >> "${GITHUB_STEP_SUMMARY}"

  container-test:
    name: Container Healthcheck Test (${{ matrix.service }})
    permissions:
      contents: read
      packages: read
    needs: build-push-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CPNUCLEO_WEB_API_IMAGE: ghcr.io/jonathanperis/cpnucleo-web-api:sha-${{ github.sha }}-amd64
      CPNUCLEO_IDENTITY_API_IMAGE: ghcr.io/jonathanperis/cpnucleo-identity-api:sha-${{ github.sha }}-amd64
      CPNUCLEO_GRPC_SERVER_IMAGE: ghcr.io/jonathanperis/cpnucleo-grpc-server:sha-${{ github.sha }}-amd64
      CPNUCLEO_WEB_CLIENT_IMAGE: ghcr.io/jonathanperis/cpnucleo-web-client:sha-${{ github.sha }}-amd64
      CPNUCLEO_EXPECTED_ARCH: amd64
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    strategy:
      matrix:
        service: [WebApi, IdentityApi, GrpcServer, WebClient]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise immutable amd64 images
        run: scripts/ci-container-test.sh "${{ matrix.service }}" --prebuilt

  container-test-arm64:
    name: Container Healthcheck Test arm64 (${{ matrix.service }})
    permissions:
      contents: read
      packages: read
    needs: build-push-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      CPNUCLEO_WEB_API_IMAGE: ghcr.io/jonathanperis/cpnucleo-web-api:sha-${{ github.sha }}-arm64
      CPNUCLEO_IDENTITY_API_IMAGE: ghcr.io/jonathanperis/cpnucleo-identity-api:sha-${{ github.sha }}-arm64
      CPNUCLEO_GRPC_SERVER_IMAGE: ghcr.io/jonathanperis/cpnucleo-grpc-server:sha-${{ github.sha }}-arm64
      CPNUCLEO_WEB_CLIENT_IMAGE: ghcr.io/jonathanperis/cpnucleo-web-client:sha-${{ github.sha }}-arm64
      CPNUCLEO_EXPECTED_ARCH: arm64
      DOCKER_DEFAULT_PLATFORM: linux/arm64
    strategy:
      matrix:
        service: [WebApi, IdentityApi, GrpcServer, WebClient]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Exercise immutable arm64 images
        run: scripts/ci-container-test.sh "${{ matrix.service }}" --prebuilt

  scan-amd64:
    name: Vulnerability Scan amd64 (${{ matrix.service }})
    permissions:
      contents: read
      packages: read
      security-events: write
    needs: build-push-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ${{ matrix.image }}:sha-${{ github.sha }}-amd64
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      TRIVY_PLATFORM: linux/amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: WebApi
            image: ghcr.io/jonathanperis/cpnucleo-web-api
            category: web-api
          - service: GrpcServer
            image: ghcr.io/jonathanperis/cpnucleo-grpc-server
            category: grpc-server
          - service: IdentityApi
            image: ghcr.io/jonathanperis/cpnucleo-identity-api
            category: identity-api
          - service: WebClient
            image: ghcr.io/jonathanperis/cpnucleo-web-client
            category: web-client

    steps:
      - name: Scan image for CRITICAL/HIGH vulnerabilities (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Upload scan results to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.category }}

      - name: Summarize CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}
          format: table
          output: trivy-results.txt
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Publish scan summary
        if: always()
        run: |
          {
            echo "### Trivy: ${{ matrix.service }} (CRITICAL/HIGH)"
            echo
            echo "Image: \`${IMAGE}\`. The job fails only for CRITICAL findings with a fixed version available."
            echo
            echo '```'
            if [[ -s trivy-results.txt ]]; then head -c 900000 trivy-results.txt; else echo "No report produced."; fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: true
          TRIVY_SKIP_JAVA_DB_UPDATE: true
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  merge-manifest:
    name: Merge Multi-arch Manifest (${{ matrix.service }})
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing: the OIDC token proves this workflow run.
      id-token: write
    needs: [build-push-amd64, build-push-arm64, container-test, container-test-arm64, scan-amd64, deploy-hostinger]
    # Mutable tags (latest) move only from main, and never to a release production rejected.
    # A main run that intentionally skips the deploy (workflow_dispatch without it) still publishes.
    if: >-
      github.ref == 'refs/heads/main' && !cancelled() &&
      needs.container-test-arm64.result == 'success' && needs.scan-amd64.result == 'success' &&
      (needs.deploy-hostinger.result == 'success' || needs.deploy-hostinger.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - service: WebApi
            image: ghcr.io/jonathanperis/cpnucleo-web-api
          - service: GrpcServer
            image: ghcr.io/jonathanperis/cpnucleo-grpc-server
          - service: IdentityApi
            image: ghcr.io/jonathanperis/cpnucleo-identity-api
          - service: WebClient
            image: ghcr.io/jonathanperis/cpnucleo-web-client

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Merge into multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ matrix.image }}:sha-${{ github.sha }} \
            --tag ${{ matrix.image }}:latest \
            ${{ matrix.image }}:sha-${{ github.sha }}-amd64 \
            ${{ matrix.image }}:sha-${{ github.sha }}-arm64

      - name: Sign multi-arch manifest (keyless)
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r '.digest')
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the manifest digest for ${IMAGE}:sha-${GITHUB_SHA}" >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE}@${digest}"
          cosign verify "${IMAGE}@${digest}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/main-release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signed ${IMAGE}@${digest} (tags sha-${GITHUB_SHA}, latest)" >> "${GITHUB_STEP_SUMMARY}"

  deploy-hostinger:
    name: Deploy to Hostinger Docker Manager
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_hostinger)
    # Hostinger runs on amd64; deploy as soon as amd64 images pass container
    # checks and the vulnerability gate instead of waiting for arm64 manifests.
    needs: [container-test, build-push-amd64, scan-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-hostinger
    permissions:
      contents: read
      packages: read
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
      HOSTINGER_PROJECT_NAME: ${{ secrets.HOSTINGER_PROJECT_NAME }}
      HOSTINGER_ENV_BASE64: ${{ secrets.HOSTINGER_ENV_BASE64 }}
      CPNUCLEO_WEB_URL: ${{ secrets.CPNUCLEO_WEB_URL }}
      CPNUCLEO_API_URL: ${{ secrets.CPNUCLEO_API_URL }}
      CPNUCLEO_IDENTITY_URL: ${{ secrets.CPNUCLEO_IDENTITY_URL }}
      CPNUCLEO_GRPC_HEALTH_URL: ${{ secrets.CPNUCLEO_GRPC_HEALTH_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Only images signed by this release workflow on main are deployed.
      - name: Verify image signatures
        run: |
          for image in cpnucleo-web-api cpnucleo-identity-api cpnucleo-grpc-server cpnucleo-web-client; do
            cosign verify "ghcr.io/jonathanperis/${image}:sha-${GITHUB_SHA}-amd64" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/main-release.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "Verified signature: ${image}:sha-${GITHUB_SHA}-amd64" >> "${GITHUB_STEP_SUMMARY}"
          done

      # Captures the running project first and redeploys it automatically if the
      # deploy action, health polling, image verification or log check fails.
      - name: Deploy Hostinger project
        run: scripts/deploy-hostinger-docker-manager.sh

      - name: Run production smoke tests
        id: smoke
        run: scripts/smoke-production.sh

      - name: Roll back Hostinger project after failed smoke tests
        if: failure() && steps.smoke.outcome == 'failure'
        run: scripts/deploy-hostinger-docker-manager.sh --rollback
