name: Main Release

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_hostinger:
        description: Deploy published images to Hostinger Docker Manager
        type: boolean
        default: true

concurrency:
  group: cpnucleo-release-${{ github.ref }}
  cancel-in-progress: false

env:
  AOT: false
  TRIM: true
  EXTRA_OPTIMIZE: true
  BUILD_CONFIGURATION: Release

jobs:
  setup-build-test:
    name: Setup, Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: WebApi
          - service: GrpcServer
          - service: IdentityApi
          - service: WebClient

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup .NET SDK
        if: matrix.service != 'WebClient'
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Setup Bun
        if: matrix.service == 'WebClient'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Setup Node
        if: matrix.service == 'WebClient'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Restore Dependencies
        if: matrix.service != 'WebClient'
        working-directory: "./src/${{ matrix.service }}"
        run: dotnet restore "${{ matrix.service }}.csproj" -p:Configuration=${{ env.BUILD_CONFIGURATION }} -p:AOT=${{ env.AOT }} -p:Trim=${{ env.TRIM }}

      - name: Install WebClient Dependencies
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun install --frozen-lockfile

      - name: Build Application
        if: matrix.service != 'WebClient'
        working-directory: "./src/${{ matrix.service }}"
        run: dotnet build "${{ matrix.service }}.csproj" -c ${{ env.BUILD_CONFIGURATION }} -p:AOT=${{ env.AOT }} -p:Trim=${{ env.TRIM }} -p:ExtraOptimize=${{ env.EXTRA_OPTIMIZE }}

      - name: Typecheck WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run typecheck

      - name: Test WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run test

      - name: Build WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run build

      - name: Architecture Tests
        if: matrix.service != 'WebClient'
        working-directory: "./tests/Architecture.Tests"
        run: dotnet test

      - name: Backend behavioral and database tests
        if: matrix.service == 'WebApi'
        run: dotnet test cpnucleo.slnx -c Release -p:AOT=false -p:Trim=false -p:ExtraOptimize=false -p:SelfContained=false --nologo

  build-push-amd64:
    name: Build & Push amd64 (${{ matrix.service }})
    permissions:
      contents: read
      packages: write
    needs: setup-build-test
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Production
    strategy:
      matrix:
        include:
          - service: WebApi
            dockerfile: ./src/WebApi/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-web-api
          - service: GrpcServer
            dockerfile: ./src/GrpcServer/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-grpc-server
          - service: IdentityApi
            dockerfile: ./src/IdentityApi/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-identity-api
          - service: WebClient
            dockerfile: ./src/WebClient/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-web-client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push amd64 Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./src/
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}-amd64
          platforms: linux/amd64
          build-args: |
            AOT=${{ env.AOT }}
            TRIM=${{ env.TRIM }}
            EXTRA_OPTIMIZE=${{ env.EXTRA_OPTIMIZE }}
            BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }}
            ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }}
            PUBLIC_WEBAPI_BASE_URL=https://api-cpnucleo.jonathanperis.tech/api
            PUBLIC_IDENTITY_API_BASE_URL=https://identity-cpnucleo.jonathanperis.tech/api
            PUBLIC_IDENTITY_API_ISSUER=https://identity-cpnucleo.jonathanperis.tech

  build-push-arm64:
    name: Build & Push arm64 (${{ matrix.service }})
    permissions:
      contents: read
      packages: write
    needs: build-push-amd64
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Production
    strategy:
      matrix:
        include:
          - service: WebApi
            dockerfile: ./src/WebApi/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-web-api
          - service: GrpcServer
            dockerfile: ./src/GrpcServer/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-grpc-server
          - service: IdentityApi
            dockerfile: ./src/IdentityApi/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-identity-api
          - service: WebClient
            dockerfile: ./src/WebClient/Dockerfile
            image: ghcr.io/jonathanperis/cpnucleo-web-client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push arm64 Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./src/
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:sha-${{ github.sha }}-arm64
            ${{ matrix.image }}:latest-arm64
          platforms: linux/arm64/v8
          build-args: |
            AOT=${{ env.AOT }}
            TRIM=${{ env.TRIM }}
            EXTRA_OPTIMIZE=${{ env.EXTRA_OPTIMIZE }}
            BUILD_CONFIGURATION=${{ env.BUILD_CONFIGURATION }}
            ASPNETCORE_ENVIRONMENT=${{ env.ASPNETCORE_ENVIRONMENT }}
            PUBLIC_WEBAPI_BASE_URL=https://api-cpnucleo.jonathanperis.tech/api
            PUBLIC_IDENTITY_API_BASE_URL=https://identity-cpnucleo.jonathanperis.tech/api
            PUBLIC_IDENTITY_API_ISSUER=https://identity-cpnucleo.jonathanperis.tech

  container-test:
    name: Container Healthcheck Test (${{ matrix.service }})
    permissions:
      contents: read
      packages: read
    needs: build-push-amd64
    runs-on: ubuntu-latest
    env:
      CPNUCLEO_WEB_API_IMAGE: ghcr.io/jonathanperis/cpnucleo-web-api:sha-${{ github.sha }}-amd64
      CPNUCLEO_IDENTITY_API_IMAGE: ghcr.io/jonathanperis/cpnucleo-identity-api:sha-${{ github.sha }}-amd64
      CPNUCLEO_GRPC_SERVER_IMAGE: ghcr.io/jonathanperis/cpnucleo-grpc-server:sha-${{ github.sha }}-amd64
      CPNUCLEO_WEB_CLIENT_IMAGE: ghcr.io/jonathanperis/cpnucleo-web-client:sha-${{ github.sha }}-amd64
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    strategy:
      matrix:
        include:
          - service: WebApi
            compose_service: webapi
            port: 5100
          - service: IdentityApi
            compose_service: identity
            port: 5200
          - service: GrpcServer
            compose_service: grpc
            port: 5301
          - service: WebClient
            compose_service: webclient
            port: 5400

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create CI compose environment
        run: |
          cat > .env <<'ENV'
          POSTGRES_USER=cpnucleo_ci
          POSTGRES_PASSWORD=cpnucleo_ci_password
          POSTGRES_DB=cpnucleo_ci
          DB_CONNECTION_STRING=Host=db;Username=cpnucleo_ci;Password=cpnucleo_ci_password;Database=cpnucleo_ci;Minimum Pool Size=1;Maximum Pool Size=5;Multiplexing=true;
          Jwt__SigningKey=ci-healthcheck-signing-key-with-at-least-32-chars
          Cors__AllowedOrigins__0=http://localhost:5400
          OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
          OTEL_EXPORTER_OTLP_HTTP_ENDPOINT=http://otel-collector:4318
          ENV

      - name: Build and Run Docker Compose for Healthcheck Test
        run: |
          docker compose -f compose.lab.yaml --profile full up ${{ matrix.compose_service }} -d --no-build --pull always
          sleep 30

      - name: Test Healthcheck Endpoint
        run: |
          for i in {1..20}; do
            ROUTE=readyz
            if [ "${{ matrix.service }}" = "WebClient" ]; then ROUTE=healthz; fi
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 http://localhost:${{ matrix.port }}/${ROUTE}) || STATUS=000
            echo "Attempt $i: Status $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed with status $STATUS"
              exit 0
            else
              echo "Healthcheck attempt $i failed with status $STATUS. Retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "Healthcheck failed after 20 attempts."
          exit 1

      - name: Exercise immutable images with local data
        if: matrix.service == 'WebApi'
        run: |
          docker compose -f compose.lab.yaml up identity -d --no-build --pull always
          docker compose -f compose.lab.yaml run --rm seed
          for i in {1..20}; do
            if curl -fsS http://localhost:5200/readyz >/dev/null; then break; fi
            sleep 3
          done
          node scripts/smoke-lab.mjs

  merge-manifest:
    name: Merge Multi-arch Manifest (${{ matrix.service }})
    permissions:
      contents: read
      packages: write
    needs: [build-push-amd64, build-push-arm64, container-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: WebApi
            image: ghcr.io/jonathanperis/cpnucleo-web-api
          - service: GrpcServer
            image: ghcr.io/jonathanperis/cpnucleo-grpc-server
          - service: IdentityApi
            image: ghcr.io/jonathanperis/cpnucleo-identity-api
          - service: WebClient
            image: ghcr.io/jonathanperis/cpnucleo-web-client

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ matrix.image }}:sha-${{ github.sha }} \
            --tag ${{ matrix.image }}:latest \
            ${{ matrix.image }}:sha-${{ github.sha }}-amd64 \
            ${{ matrix.image }}:sha-${{ github.sha }}-arm64

  deploy-hostinger:
    name: Deploy to Hostinger Docker Manager
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_hostinger)
    # Hostinger runs on amd64; deploy as soon as amd64 images and container
    # healthchecks pass instead of waiting for slow arm64 multi-arch manifests.
    needs: [container-test, build-push-amd64]
    runs-on: ubuntu-latest
    environment: production-hostinger
    permissions:
      contents: read
      packages: read
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_VPS_ID: ${{ secrets.HOSTINGER_VPS_ID }}
      HOSTINGER_PROJECT_NAME: ${{ secrets.HOSTINGER_PROJECT_NAME }}
      HOSTINGER_ENV_BASE64: ${{ secrets.HOSTINGER_ENV_BASE64 }}
      CPNUCLEO_WEB_URL: ${{ secrets.CPNUCLEO_WEB_URL }}
      CPNUCLEO_API_URL: ${{ secrets.CPNUCLEO_API_URL }}
      CPNUCLEO_IDENTITY_URL: ${{ secrets.CPNUCLEO_IDENTITY_URL }}
      CPNUCLEO_GRPC_HEALTH_URL: ${{ secrets.CPNUCLEO_GRPC_HEALTH_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Hostinger project
        run: scripts/deploy-hostinger-docker-manager.sh

      - name: Run production smoke tests
        run: scripts/smoke-production.sh
