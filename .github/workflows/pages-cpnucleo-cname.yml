# One-shot: move cpnucleo.jonathanperis.tech from the app address to GitHub Pages. Do not merge this file.
name: Point cpnucleo at GitHub Pages

on:
  pull_request:
    paths:
      - .github/workflows/pages-cpnucleo-cname.yml

permissions:
  contents: read

jobs:
  records:
    name: Replace the cpnucleo address with a Pages CNAME
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Hostinger CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/hostinger.tar.gz https://github.com/hostinger/api-cli/releases/download/v4.1.4/hostinger-4.1.4-linux-amd64.tar.gz
          echo "0c69621a4f70b929dfd876c29100dc11b4afd535a657d5b8270ecb5aa09c8f81  /tmp/hostinger.tar.gz" | sha256sum -c
          tar -xzf /tmp/hostinger.tar.gz -C /tmp
          install -m 0755 /tmp/hostinger /usr/local/bin/hostinger
          hostinger version

      - name: Replace cpnucleo
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: |
          set -euo pipefail
          hostinger dns records list jonathanperis.tech --format json > /tmp/zone.json
          python3 - << 'PY'
          import json, subprocess, sys
          raw = json.load(open("/tmp/zone.json"))
          if isinstance(raw, list):
              records = raw
          elif isinstance(raw, dict):
              records = raw.get("zone") or raw.get("records") or []
              if isinstance(records, dict):
                  records = records.get("zone") or records.get("records") or []
          else:
              records = []
          if not isinstance(records, list) or not records or not isinstance(records[0], dict):
              raise SystemExit(f"unexpected zone shape: {type(raw).__name__}")

          def contents_of(item):
              nested = item.get("records")
              if isinstance(nested, list):
                  return [str(rec.get("content", "") if isinstance(rec, dict) else rec).rstrip(".") for rec in nested]
              if item.get("content") is not None:
                  return [str(item.get("content")).rstrip(".")]
              return []

          existing = {}
          for item in records:
              name = str(item.get("name", ""))
              typ = str(item.get("type", ""))
              existing.setdefault(name, []).append((typ, contents_of(item)))
              print(f"{typ:8} {name} {contents_of(item)}")

          apex = existing.get("@") or []
          if not any(typ == "A" and "2.57.91.91" in contents for typ, contents in apex):
              raise SystemExit(f"refusing to continue: apex is not 2.57.91.91: {apex}")
          app = existing.get("app-cpnucleo", [])
          if not any(typ == "A" and "76.13.116.130" in contents for typ, contents in app):
              raise SystemExit(f"refusing to continue: app-cpnucleo is not 76.13.116.130: {app}")
          for required in ("api-cpnucleo", "identity-cpnucleo", "grpc-cpnucleo"):
              found = existing.get(required, [])
              if not any(typ == "A" and "76.13.116.130" in contents for typ, contents in found):
                  raise SystemExit(f"refusing to continue: {required} is not 76.13.116.130: {found}")
          www = existing.get("www", [])
          if not any(typ == "CNAME" and "jonathanperis.github.io" in contents for typ, contents in www):
              raise SystemExit(f"refusing to continue: www is not a Pages CNAME: {www}")

          name = "cpnucleo"
          found = existing.get(name, [])
          if any(typ == "CNAME" and "jonathanperis.github.io" in contents for typ, contents in found):
              print("cpnucleo already points at GitHub Pages")
              sys.exit(0)
          if not (len(found) == 1 and found[0][0] == "A" and found[0][1] == ["76.13.116.130"]):
              raise SystemExit(f"refusing to replace cpnucleo: {found}")

          print("deleting cpnucleo A")
          subprocess.run([
              "hostinger", "dns", "records", "delete", "jonathanperis.tech",
              "--filters", json.dumps([{"name": name, "type": "A"}]),
          ], check=True)
          print("adding cpnucleo CNAME")
          try:
              subprocess.run([
                  "hostinger", "dns", "records", "update", "jonathanperis.tech",
                  "--overwrite=false",
                  "--zone", json.dumps([{
                      "name": name,
                      "type": "CNAME",
                      "ttl": 300,
                      "records": [{"content": "jonathanperis.github.io."}],
                  }]),
              ], check=True)
          except subprocess.CalledProcessError:
              print("CNAME add failed; restoring cpnucleo A")
              subprocess.run([
                  "hostinger", "dns", "records", "update", "jonathanperis.tech",
                  "--overwrite=false",
                  "--zone", json.dumps([{
                      "name": name,
                      "type": "A",
                      "ttl": 300,
                      "records": [{"content": "76.13.116.130"}],
                  }]),
              ], check=False)
              raise
          PY
          hostinger dns records list jonathanperis.tech --format json > /tmp/zone-after.json
          python3 - << 'PY'
          import json
          raw = json.load(open("/tmp/zone-after.json"))
          records = raw if isinstance(raw, list) else []
          def contents_of(item):
              nested = item.get("records")
              if isinstance(nested, list):
                  return [str(rec.get("content", "") if isinstance(rec, dict) else rec).rstrip(".") for rec in nested]
              if item.get("content") is not None:
                  return [str(item.get("content")).rstrip(".")]
              return []
          by_name = {}
          for item in records:
              by_name.setdefault(str(item.get("name", "")), []).append((str(item.get("type", "")), contents_of(item)))
          cpn = by_name.get("cpnucleo", [])
          if not any(typ == "CNAME" and "jonathanperis.github.io" in contents for typ, contents in cpn):
              raise SystemExit(f"cpnucleo was not moved: {cpn}")
          if any(typ == "A" for typ, _ in cpn):
              raise SystemExit(f"cpnucleo still has an address: {cpn}")
          for required in ("app-cpnucleo", "api-cpnucleo", "identity-cpnucleo", "grpc-cpnucleo"):
              if not any(typ == "A" and "76.13.116.130" in contents for typ, contents in by_name.get(required, [])):
                  raise SystemExit(f"{required} changed")
          if not any(typ == "A" and "2.57.91.91" in contents for typ, contents in by_name.get("@", [])):
              raise SystemExit("apex changed")
          print("cpnucleo points at Pages; the app and API addresses are unchanged")
          PY
