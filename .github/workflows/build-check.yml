name: Build Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

env:
  AOT: false
  TRIM: false
  EXTRA_OPTIMIZE: false
  BUILD_CONFIGURATION: Debug

jobs:
  setup-build-test:
    name: Setup, Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service: WebApi
          - service: GrpcServer
          - service: IdentityApi
          - service: WebClient

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup .NET SDK
        if: matrix.service != 'WebClient'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Bun
        if: matrix.service == 'WebClient'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Restore Dependencies
        if: matrix.service != 'WebClient'
        working-directory: "./src/${{ matrix.service }}"
        run: dotnet restore "${{ matrix.service }}.csproj" -p:Configuration=${{ env.BUILD_CONFIGURATION }} -p:AOT=${{ env.AOT }} -p:Trim=${{ env.TRIM }}

      - name: Install WebClient Dependencies
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun install --frozen-lockfile

      - name: Build Application
        if: matrix.service != 'WebClient'
        working-directory: "./src/${{ matrix.service }}"
        run: dotnet build "${{ matrix.service }}.csproj" -c ${{ env.BUILD_CONFIGURATION }} -p:AOT=${{ env.AOT }} -p:Trim=${{ env.TRIM }} -p:ExtraOptimize=${{ env.EXTRA_OPTIMIZE }}

      - name: Typecheck WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run typecheck

      - name: Test WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun test

      - name: Build WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run build

      # - name: Unit Tests
      #   working-directory: "./tests/Application.Tests"
      #   run: dotnet test

      - name: Architecture Tests
        if: matrix.service != 'WebClient'
        working-directory: "./tests/Architecture.Tests"
        run: dotnet test --collect:"XPlat Code Coverage" --results-directory ../../coverage

      - name: Upload coverage to Codecov
        if: matrix.service != 'WebClient'
        uses: codecov/codecov-action@v6
        with:
          directory: ./coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      # - name: Build and Run Docker Compose for Integration Tests
      #   run: |
      #     docker compose up db -d --build --force-recreate
      #     sleep 30

      # - name: Integration Tests
      #   working-directory: "./tests/WebApi.Integration.Tests"
      #   run: dotnet test

  container-test:
    name: Container Healthcheck Test (${{ matrix.service }})
    needs: setup-build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service: WebApi
            compose_service: webapi1-cpnucleo
            port: 5100
          - service: IdentityApi
            compose_service: identityapi-cpnucleo
            port: 5200
          - service: GrpcServer
            compose_service: grpcserver-cpnucleo
            port: 5301
          - service: WebClient
            compose_service: webclient-cpnucleo
            port: 5400

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build and Run Docker Compose for Healthcheck Test
        run: |
          docker compose up ${{ matrix.compose_service }} -d --build --force-recreate --no-deps
          sleep 30

      - name: Test Healthcheck Endpoint
        run: |
          for i in {1..20}; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 http://localhost:${{ matrix.port }}/healthz) || STATUS=000
            echo "Attempt $i: Status $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Healthcheck passed with status $STATUS"
              exit 0
            else
              echo "Healthcheck attempt $i failed with status $STATUS. Retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "Healthcheck failed after 20 attempts."
          exit 1
