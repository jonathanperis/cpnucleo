name: Build Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to a PR supersedes the previous run.
concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AOT: false
  TRIM: false
  EXTRA_OPTIMIZE: false
  BUILD_CONFIGURATION: Debug

jobs:
  setup-build-test:
    name: Setup, Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - service: WebApi
          - service: GrpcServer
          - service: IdentityApi
          - service: WebClient

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        if: matrix.service != 'WebClient'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Bun
        if: matrix.service == 'WebClient'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Setup Node
        if: matrix.service == 'WebClient'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'

      - name: Restore Dependencies
        if: matrix.service != 'WebClient'
        working-directory: "./src/${{ matrix.service }}"
        run: dotnet restore "${{ matrix.service }}.csproj" -p:Configuration=${{ env.BUILD_CONFIGURATION }} -p:AOT=${{ env.AOT }} -p:Trim=${{ env.TRIM }}

      - name: Install WebClient Dependencies
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun install --frozen-lockfile

      - name: Build Application
        if: matrix.service != 'WebClient'
        working-directory: "./src/${{ matrix.service }}"
        run: dotnet build "${{ matrix.service }}.csproj" -c ${{ env.BUILD_CONFIGURATION }} -p:AOT=${{ env.AOT }} -p:Trim=${{ env.TRIM }} -p:ExtraOptimize=${{ env.EXTRA_OPTIMIZE }}

      - name: Typecheck WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run typecheck

      - name: Test WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run test

      - name: Build WebClient
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun run build

      # Every .NET suite (Architecture, unit, security and Docker-backed
      # integration tests) runs exactly once, here, with coverage collected.
      - name: Backend behavioral and database tests
        if: matrix.service == 'WebApi'
        run: >-
          dotnet test cpnucleo.slnx
          -p:AOT=false -p:Trim=false -p:ExtraOptimize=false -p:SelfContained=false
          --nologo
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Merge coverage reports
        if: matrix.service == 'WebApi'
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
        with:
          reports: coverage/**/coverage.cobertura.xml
          targetdir: coverage-report
          reporttypes: Cobertura;MarkdownSummaryGithub
          title: Cpnucleo .NET coverage

      - name: Publish coverage summary
        if: matrix.service == 'WebApi'
        run: |
          files=$(find coverage -name coverage.cobertura.xml | wc -l | tr -d ' ')
          {
            echo "### Coverage inputs"
            echo
            echo "Merged ${files} Cobertura file(s). Only projects referencing \`coverlet.collector\` emit one."
            echo
            echo "| Test project | Coverage collector |"
            echo "|---|---|"
            for project in tests/*/*.csproj; do
              if grep -q 'coverlet.collector' "${project}"; then state=yes; else state="missing (no coverage)"; fi
              echo "| $(basename "${project}" .csproj) | ${state} |"
            done
            echo
            cat coverage-report/SummaryGithub.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload merged coverage
        if: matrix.service == 'WebApi'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cobertura
          path: coverage-report/Cobertura.xml
          if-no-files-found: error
          retention-days: 7

      - name: Verify isolated learning experiments
        if: matrix.service == 'WebApi'
        run: |
          dotnet run --project labs/OutboxLab -c Release
          dotnet run --project labs/PersistenceLab -c Release -- --rows 200 --iterations 5

      - name: Audit WebClient dependencies
        if: matrix.service == 'WebClient'
        working-directory: ./src/WebClient
        run: bun audit

  coverage-upload:
    name: Upload coverage to Codecov
    needs: setup-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Tokenless Codecov upload through GitHub OIDC; scoped to this job only.
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download merged coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-cobertura
          path: coverage-report

      # Non-blocking by design (continue-on-error), but the action is told to
      # report upload errors so this step's outcome is visible below.
      - name: Upload coverage to Codecov
        id: codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage-report/Cobertura.xml
          use_oidc: true
          fail_ci_if_error: true

      - name: Report Codecov upload outcome
        if: always()
        env:
          OUTCOME: ${{ steps.codecov.outcome }}
        run: |
          if [[ "${OUTCOME}" == success ]]; then
            echo "Codecov upload succeeded." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning title=Codecov upload ${OUTCOME}::Coverage was not uploaded to Codecov. The repository may still need activation on codecov.io, or OIDC is unavailable (fork PRs)."
            {
              echo "### Codecov upload: ${OUTCOME}"
              echo
              echo "Coverage was merged and summarized above, but the Codecov upload did not succeed."
              echo "This does not fail CI. Check that the repository is activated on codecov.io (OIDC uploads need no token)."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

  container-test:
    name: Container Healthcheck Test (${{ matrix.service }})
    needs: setup-build-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        service: [WebApi, IdentityApi, GrpcServer, WebClient]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build lab images and exercise containers
        run: |
          args=()
          if [[ "${{ matrix.service }}" == WebApi ]]; then args+=(--restore-check); fi
          scripts/ci-container-test.sh "${{ matrix.service }}" "${args[@]}"

  # Catches ReadyToRun/self-contained (TRIM=true) and ExtraOptimize regressions
  # in the exact release Dockerfile configuration before they reach main.
  release-image-build:
    name: Release Image Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: WebApi
            cache: web-api
          - service: IdentityApi
            cache: identity-api
          - service: GrpcServer
            cache: grpc-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build release image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src/
          file: ./src/${{ matrix.service }}/Dockerfile
          push: false
          platforms: linux/amd64
          # Reuse layers cached by main-release; PR builds do not write cache.
          cache-from: type=gha,scope=${{ matrix.cache }}-amd64
          build-args: |
            AOT=false
            TRIM=true
            EXTRA_OPTIMIZE=true
            BUILD_CONFIGURATION=Release
            ASPNETCORE_ENVIRONMENT=Production

  documentation:
    name: Documentation and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: python3 scripts/check-docs-drift.py
      - run: bun install --frozen-lockfile && bun audit && bun run build
        working-directory: docs
      - run: python3 scripts/test_docs_drift.py && python3 scripts/check-docs-drift.py --built-site
