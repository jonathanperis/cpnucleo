name: "cpnucleo-prod"

# Hostinger production profile.
# Public traffic is terminated by the existing Traefik stack on the external
# network below. Application/database ports stay private to Docker networks.
# Minimum VPS: 2 vCPU / 4 GiB RAM. Recommended VPS: 4 vCPU / 8 GiB RAM.

x-common-healthcheck:
  x-healthcheck-api: &healthcheck-api
    test: ["CMD-SHELL", "timeout 5 bash -ec \"exec 3<>/dev/tcp/127.0.0.1/5000; printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '\""]
    interval: 1m
    start_period: 1m
    start_interval: 10s
    timeout: 10s
    retries: 3
  x-healthcheck-identity: &healthcheck-identity
    test: ["CMD-SHELL", "timeout 5 bash -ec \"exec 3<>/dev/tcp/127.0.0.1/5010; printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '\""]
    interval: 1m
    start_period: 1m
    start_interval: 10s
    timeout: 10s
    retries: 3
  x-healthcheck-grpcserver: &healthcheck-grpcserver
    test: ["CMD-SHELL", "timeout 5 bash -ec \"exec 3<>/dev/tcp/127.0.0.1/5021; printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '\""]
    interval: 1m
    start_period: 1m
    start_interval: 10s
    timeout: 10s
    retries: 3
  x-healthcheck-webclient: &healthcheck-webclient
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5030/healthz"]
    interval: 1m
    start_period: 1m
    start_interval: 10s
    timeout: 10s
    retries: 3

# Each container receives only the variables it needs; there is no shared
# env_file. Compose still reads .env (or --env-file) for the ${...} values.
x-dotnet-runtime-env: &dotnet-runtime-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  # Traefik -> NGINX -> API: per-IP rate limiting needs the forwarded client IP.
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  DB_CONNECTION_STRING: ${DB_CONNECTION_STRING:?Set DB_CONNECTION_STRING}
  Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey}
  # Optional RS256 verification key. Empty means "not configured" (HS256 via Jwt__SigningKey).
  Jwt__SigningPublicKey: ${Jwt__SigningPublicKey:-}
  # IdentityApi grants admin claims from this list; WebApi and GrpcServer re-check it on every
  # session validation so removing a login revokes admin access within 30 seconds.
  CPNUCLEO_ADMIN_LOGINS: ${CPNUCLEO_ADMIN_LOGINS:-}
  Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-https://cpnucleo.jonathanperis.tech}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-30000}
  # parentbased_always_on matches the in-code default; set e.g. parentbased_traceidratio + ARG to sample less.
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_always_on}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

# Application containers run unprivileged with an immutable root filesystem;
# /tmp is the only writable path.
x-app-hardening: &app-hardening
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp

x-common-api-prod: &common-api-prod
  <<: *app-hardening
  depends_on:
    db:
      condition: service_healthy
    migrate-cpnucleo:
      condition: service_completed_successfully
    otel-collector:
      condition: service_started
  environment:
    <<: *dotnet-runtime-env
  restart: always
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: "512M"
      reservations:
        cpus: "0.25"
        memory: "256M"

x-common-logging: &common-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate-cpnucleo:
    <<: *app-hardening
    image: ${CPNUCLEO_WEB_API_IMAGE:?Set CPNUCLEO_WEB_API_IMAGE to an immutable GHCR tag}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING:?Set DB_CONNECTION_STRING}
    command: ["--migrate-database"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Grafana UI is published through the nginx gateway (port 3000), not directly:
  # this container stays off the shared Traefik network so its OTLP receivers
  # (4317/4318) are reachable only on the private Compose network.
  otel-lgtm:
    image: grafana/otel-lgtm:0.33.0
    container_name: otel-lgtm-cpnucleo
    volumes:
      - otel_lgtm_data:/data
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    expose:
      - "3000"
      - "4317"
      - "4318"
    networks:
      - default
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: "1G"
        reservations:
          cpus: "0.25"
          memory: "512M"
    <<: *common-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector-cpnucleo
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    configs:
      - source: otel_collector_config
        target: /etc/otelcol-contrib/config.yaml
    environment:
      CPNUCLEO_DEPLOYMENT_ENVIRONMENT: production
      CPNUCLEO_HOST_PROVIDER: hostinger
    depends_on:
      - otel-lgtm
    expose:
      - "4317"
      - "4318"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.10"
          memory: "128M"
    <<: *common-logging

  webapi1-cpnucleo: &webapi1
    <<: [*common-api-prod, *common-logging]
    image: ${CPNUCLEO_WEB_API_IMAGE:?Set CPNUCLEO_WEB_API_IMAGE to an immutable GHCR tag, not latest}
    container_name: webapi1-cpnucleo
    expose:
      - "5000"
    healthcheck: *healthcheck-api

  webapi2-cpnucleo:
    <<: [*webapi1, *common-api-prod, *common-logging]
    container_name: webapi2-cpnucleo
    expose:
      - "5000"

  identityapi-cpnucleo:
    <<: [*common-api-prod, *common-logging]
    image: ${CPNUCLEO_IDENTITY_API_IMAGE:?Set CPNUCLEO_IDENTITY_API_IMAGE to an immutable GHCR tag, not latest}
    container_name: identityapi-cpnucleo
    environment:
      <<: *dotnet-runtime-env
      # Optional RS256 signing key, held only by the token issuer.
      Jwt__SigningPrivateKey: ${Jwt__SigningPrivateKey:-}
    expose:
      - "5010"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.cpnucleo-identity.rule=Host(`${CPNUCLEO_IDENTITY_HOST:?Set CPNUCLEO_IDENTITY_HOST}`)"
      - "traefik.http.routers.cpnucleo-identity.entrypoints=websecure"
      - "traefik.http.routers.cpnucleo-identity.tls=true"
      - "traefik.http.routers.cpnucleo-identity.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.cpnucleo-identity.middlewares=cpnucleo-security-headers"
      - "traefik.http.middlewares.cpnucleo-security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.cpnucleo-security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.cpnucleo-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.cpnucleo-security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.cpnucleo-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.services.cpnucleo-identity.loadbalancer.server.port=5010"
    healthcheck: *healthcheck-identity

  grpcserver-cpnucleo:
    <<: [*common-api-prod, *common-logging]
    image: ${CPNUCLEO_GRPC_SERVER_IMAGE:?Set CPNUCLEO_GRPC_SERVER_IMAGE to an immutable GHCR tag, not latest}
    container_name: grpcserver-cpnucleo
    expose:
      - "5020"
      - "5021"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.cpnucleo-grpc.rule=Host(`${CPNUCLEO_GRPC_HOST:?Set CPNUCLEO_GRPC_HOST}`)"
      - "traefik.http.routers.cpnucleo-grpc.entrypoints=websecure"
      - "traefik.http.routers.cpnucleo-grpc.tls=true"
      - "traefik.http.routers.cpnucleo-grpc.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.cpnucleo-grpc.middlewares=cpnucleo-security-headers"
      - "traefik.http.services.cpnucleo-grpc.loadbalancer.server.port=5020"
      - "traefik.http.services.cpnucleo-grpc.loadbalancer.server.scheme=h2c"
    healthcheck: *healthcheck-grpcserver

  webclient-cpnucleo:
    <<: [*app-hardening, *common-logging]
    image: ${CPNUCLEO_WEB_CLIENT_IMAGE:?Set CPNUCLEO_WEB_CLIENT_IMAGE to an immutable GHCR tag, not latest}
    container_name: webclient-cpnucleo
    expose:
      - "5030"
    healthcheck: *healthcheck-webclient
    # WebClient URLs are compiled into the static assets by the release build
    # (PUBLIC_* build args); runtime variables cannot retarget them, so the
    # container receives only its server-side telemetry settings.
    environment:
      OTEL_EXPORTER_OTLP_HTTP_ENDPOINT: ${OTEL_EXPORTER_OTLP_HTTP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: WebClient-Cpnucleo
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-30000}
    depends_on:
      otel-collector:
        condition: service_started
    restart: always
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.cpnucleo-web.rule=Host(`${CPNUCLEO_WEB_HOST:?Set CPNUCLEO_WEB_HOST}`)"
      - "traefik.http.routers.cpnucleo-web.entrypoints=websecure"
      - "traefik.http.routers.cpnucleo-web.tls=true"
      - "traefik.http.routers.cpnucleo-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.cpnucleo-web.middlewares=cpnucleo-security-headers"
      - "traefik.http.services.cpnucleo-web.loadbalancer.server.port=5030"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "256M"

  db:
    image: postgres:16.15
    container_name: db-cpnucleo
    volumes:
      - db_data:/var/lib/postgresql/data
    configs:
      - source: init_track_commit_timestamp
        target: /docker-entrypoint-initdb.d/001-track-commit-timestamp.sql
      - source: init_database_dump_ddl
        target: /docker-entrypoint-initdb.d/002-database-dump-ddl.sql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No host port: PostgreSQL is reachable only by containers on cpnucleo_network.
    expose:
      - "5432"
    # Production-safe settings: keep durability enabled; only tune checkpoint/WAL size.
    command: postgres -c checkpoint_timeout=600 -c max_wal_size=1024
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1G"
        reservations:
          cpus: "0.50"
          memory: "512M"
    <<: *common-logging

  # Kept in production as the internal API load balancer, matching local dev topology.
  # Traefik owns public TLS/host routing; NGINX balances webapi1/webapi2 on 9999
  # and is the only route to the Grafana UI on 3000 (see otel-lgtm).
  nginx:
    image: nginx:1.30.5-alpine
    container_name: nginx-cpnucleo
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    depends_on:
      webapi1-cpnucleo:
        condition: service_healthy
      webapi2-cpnucleo:
        condition: service_healthy
      identityapi-cpnucleo:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    expose:
      - "9999"
      - "3000"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik}"
      - "traefik.http.routers.cpnucleo-api.rule=Host(`${CPNUCLEO_API_HOST:?Set CPNUCLEO_API_HOST}`)"
      - "traefik.http.routers.cpnucleo-api.entrypoints=websecure"
      - "traefik.http.routers.cpnucleo-api.tls=true"
      - "traefik.http.routers.cpnucleo-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.cpnucleo-api.middlewares=cpnucleo-security-headers"
      - "traefik.http.routers.cpnucleo-api.service=cpnucleo-api"
      - "traefik.http.services.cpnucleo-api.loadbalancer.server.port=9999"
      - "traefik.http.routers.cpnucleo-grafana.rule=Host(`${CPNUCLEO_GRAFANA_HOST:?Set CPNUCLEO_GRAFANA_HOST}`)"
      - "traefik.http.routers.cpnucleo-grafana.entrypoints=websecure"
      - "traefik.http.routers.cpnucleo-grafana.tls=true"
      - "traefik.http.routers.cpnucleo-grafana.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.cpnucleo-grafana.middlewares=cpnucleo-grafana-auth"
      - "traefik.http.routers.cpnucleo-grafana.service=cpnucleo-grafana"
      - "traefik.http.middlewares.cpnucleo-grafana-auth.basicauth.users=${CPNUCLEO_GRAFANA_BASIC_AUTH_USERS:?Set CPNUCLEO_GRAFANA_BASIC_AUTH_USERS}"
      - "traefik.http.services.cpnucleo-grafana.loadbalancer.server.port=3000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"
        reservations:
          cpus: "0.10"
          memory: "128M"
    <<: *common-logging

volumes:
  otel_lgtm_data:
    driver: local
    labels:
      - "com.example.service=cpnucleo-otel-lgtm"
  db_data:
    driver: local
    labels:
      - "com.example.service=cpnucleo-db"

configs:
  otel_collector_config:
    content: |
      # OpenTelemetry Collector gateway shared by the local Compose stack and the
      # single-VPS Hostinger stack (compose.prod.yaml inlines this file verbatim, with
      # dollar signs doubled for Compose). cpnucleo services send OTLP to otel-collector:4317;
      # the collector forwards traces, metrics, and logs to the Grafana LGTM stack.
      # Deployment labels come from the collector container environment, so local
      # telemetry is never labelled as production by accident.

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        memory_limiter:
          check_interval: 5s
          limit_mib: 192
          spike_limit_mib: 64

        resource:
          attributes:
            - key: deployment.environment
              value: $${env:CPNUCLEO_DEPLOYMENT_ENVIRONMENT:-development}
              action: upsert
            - key: service.namespace
              value: cpnucleo
              action: upsert
            - key: host.provider
              value: $${env:CPNUCLEO_HOST_PROVIDER:-local}
              action: upsert

        batch:
          timeout: 5s
          send_batch_size: 1024
          send_batch_max_size: 2048

      exporters:
        otlp/lgtm:
          endpoint: otel-lgtm:4317
          tls:
            insecure: true
          sending_queue:
            enabled: true
            num_consumers: 2
            queue_size: 1024
          retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_interval: 30s
            max_elapsed_time: 300s

        debug:
          verbosity: basic

      extensions:
        health_check:
          endpoint: 0.0.0.0:13133

      service:
        extensions: [health_check]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [otlp/lgtm]

          metrics:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [otlp/lgtm]

          logs:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [otlp/lgtm]
  nginx_config:
    content: |
      worker_processes auto; # Auto-detects the number of cores and launches that many worker processes

      events {
          worker_connections 1024; # Increase if you need to handle more than 1,000 connections simultaneously
          use epoll; # Use efficient event model for Linux
          multi_accept on; # Accept as many connections as possible when they come in
      }

      http {
          sendfile on; # Allows Nginx to use the sendfile system call to serve static files
          tcp_nopush on; # Optimizes the amount of data sent at once
          tcp_nodelay on; # Disables Nagle's algorithm to improve network efficiency
          keepalive_timeout 65s; # Keeps idle client connections (for example from Traefik) open for reuse
          types_hash_max_size 2048; # Increases the maximum size of the types hash tables
          server_tokens off; # Hides Nginx version information from error pages and Server response header field

          access_log off;

          # Docker's embedded DNS. Upstream names are re-resolved at runtime, so a
          # recreated container with a new IP is picked up without restarting NGINX.
          resolver 127.0.0.11 valid=10s ipv6=off;
          resolver_timeout 5s;

          # WebSocket upgrades (Grafana Live) pass through; everything else reuses
          # pooled upstream keepalive connections with an empty Connection header.
          map $$http_upgrade $$connection_upgrade {
              default upgrade;
              '' '';
          }

          upstream api {
              zone api 64k; # Shared memory is required for runtime re-resolution
              least_conn; # Sends new requests to the server with the least number of active connections
              server webapi1-cpnucleo:5000 resolve;
              server webapi2-cpnucleo:5000 resolve;
              keepalive 16; # Idle keepalive connections cached per worker
          }

          upstream grafana {
              zone grafana 64k;
              server otel-lgtm:3000 resolve;
              keepalive 4;
          }

          gzip on; # Enables gzip compression to reduce the size of the HTTP response
          gzip_comp_level 5; # Sets the level of compression (1 is least, 9 is most)
          gzip_min_length 256; # Sets the minimum length of a response that will be gzipped
          gzip_proxied any; # Compress data even for clients that are connecting via proxies
          gzip_vary on; # Tells proxies to cache both gzipped and regular versions of a resource

          server {
              listen 9999;

              location / {
                  proxy_buffering off;
                  proxy_read_timeout 60s;
                  proxy_http_version 1.1; # Required for upstream keepalive
                  proxy_set_header Connection ""; # Lets NGINX reuse upstream connections
                  proxy_pass http://api;
                  proxy_set_header Host $$host; # Passes the original host header to the backend
                  proxy_set_header X-Real-IP $$remote_addr; # Passes the original IP address of the client
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for; # Passes the original "X-Forwarded-For" header
                  proxy_set_header X-Forwarded-Proto $$scheme; # Passes the original scheme of the client
              }
          }

          # Grafana UI gateway. Only this HTTP port is routed by Traefik; the LGTM
          # container stays off the shared Traefik network, so its OTLP receivers
          # (4317/4318) are reachable only on the private Compose network.
          server {
              listen 3000;

              location / {
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection $$connection_upgrade;
                  proxy_read_timeout 60s;
                  proxy_pass http://grafana;
                  proxy_set_header Host $$host;
                  proxy_set_header X-Real-IP $$remote_addr;
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $$scheme;
              }
          }
      }
  init_track_commit_timestamp:
    content: |
      ALTER SYSTEM SET track_commit_timestamp = on;
  init_database_dump_ddl:
    content: |
      CREATE TABLE IF NOT EXISTS "__EFMigrationsHistory" (
          "MigrationId" character varying(150) NOT NULL,
          "ProductVersion" character varying(32) NOT NULL,
          CONSTRAINT "PK___EFMigrationsHistory" PRIMARY KEY ("MigrationId")
      );

      START TRANSACTION;


      DO $$EF$$
      BEGIN
          IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20250219224724_InitiaDblMigration') THEN
          CREATE TABLE "AssignmentTypes" (
              "Id" uuid NOT NULL,
              "Name" text,
              "CreatedAt" timestamp with time zone NOT NULL,
              "UpdatedAt" timestamp with time zone,
              "DeletedAt" timestamp with time zone,
              "Active" boolean NOT NULL,
              CONSTRAINT "PK_AssignmentTypes" PRIMARY KEY ("Id")
          );
          END IF;
      END $$EF$$;

      DO $$EF$$
      BEGIN
          IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20250219224724_InitiaDblMigration') THEN
          CREATE TABLE "Impediments" (
              "Id" uuid NOT NULL,
              "Name" text,
              "CreatedAt" timestamp with time zone NOT NULL,
              "UpdatedAt" timestamp with time zone,
              "DeletedAt" timestamp with time zone,
              "Active" boolean NOT NULL,
              CONSTRAINT "PK_Impediments" PRIMARY KEY ("Id")
          );
          END IF;
      END $$EF$$;

      DO $$EF$$
      BEGIN
          IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20250219224724_InitiaDblMigration') THEN
          CREATE TABLE "Organizations" (
              "Id" uuid NOT NULL,
              "Name" text,
              "Description" text,
              "CreatedAt" timestamp with time zone NOT NULL,
              "UpdatedAt" timestamp with time zone,
              "DeletedAt" timestamp with time zone,
              "Active" boolean NOT NULL,
              CONSTRAINT "PK_Organizations" PRIMARY KEY ("Id")
          );
          END IF;
      END $$EF$$;

      DO $$EF$$
      BEGIN
          IF NOT EXISTS(SELECT 1 FROM "__EFMigrationsHistory" WHERE "MigrationId" = '20250219224724_InitiaDblMigration') THEN
          CREATE TABLE "Users" (
              "Id" uuid NOT NULL,
              "Name" text,
              "Login" text,
              "Password" text,
              "Salt" text,
              "CreatedAt" timestamp with time zone NOT NULL,
              "UpdatedAt" timestamp with time zone,
              "DeletedAt" timestamp with time zone,
              "Active" boolean NOT NULL,
              CONSTRAINT "PK_Users" PRIMARY KEY ("Id")
          );
          END IF;
      END $$EF$$;

